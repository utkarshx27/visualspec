platform: linkedin
displayName: "LinkedIn"

formats:
  feed_portrait:
    width: 1080
    height: 1350
    aspect_ratio: "4:5"
    safe_margin:
      top: 80
      right: 80
      bottom: 80
      left: 80

  square:
    width: 1080
    height: 1080
    aspect_ratio: "1:1"
    safe_margin:
      top: 70
      right: 70
      bottom: 70
      left: 70

  banner:
    width: 1200
    height: 628
    aspect_ratio: "1.91:1"
    safe_margin:
      top: 60
      right: 80
      bottom: 60
      left: 80

guidance:
  max_primary_text_blocks: 4
  prefer_large_headline: true
  mobile_first: true
  tone: professional_authoritative

anti_patterns:
  - clickbait_typography
  - cluttered_footer
  - illegible_subtitles
