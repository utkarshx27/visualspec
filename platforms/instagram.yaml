platform: instagram
displayName: "Instagram"

formats:
  feed_portrait:
    width: 1080
    height: 1350
    aspect_ratio: "4:5"
    safe_margin:
      top: 72
      right: 64
      bottom: 72
      left: 64

  square:
    width: 1080
    height: 1080
    aspect_ratio: "1:1"
    safe_margin:
      top: 60
      right: 60
      bottom: 60
      left: 60

  story:
    width: 1080
    height: 1920
    aspect_ratio: "9:16"
    safe_margin:
      top: 250
      right: 70
      bottom: 250
      left: 70

guidance:
  max_primary_text_blocks: 3
  prefer_large_headline: true
  mobile_first: true

anti_patterns:
  - tiny_text
  - edge_aligned_headline
  - excessive_information_density
  - low_contrast_text_on_noisy_subject
